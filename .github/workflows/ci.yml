name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q sceneops tests
      - name: Frontend syntax
        run: node --check sceneops/web/app.js
      - name: Tests and coverage
        run: |
          python -m coverage run -m unittest discover -v
          python -m coverage report
      - name: Evaluation smoke
        run: python -m sceneops.evaluation --variants 1 --output tmp/evaluation
      - name: CLI smoke
        run: |
          sceneops --help
          sceneops-eval --help
